{% extends "base.html" %}
{% block titre %}Accueil{% endblock %}
{% block contenu %}
    <h2>Consulter les effectifs</h2>
    <form action="{{ url_for('effectifs.afficher') }}" method="get">
    <label for="profession">Profession</label>
    <select name="profession_id" id="profession" required>
        <option value="">-- Choisir --</option>
        {% for p in professions %}
            <option value="{{ p.id }}">{{ p.libelle }}</option>
        {% endfor %}
    </select>
    <label for="region">Région</label>
    <select name="region_id" id="region" required>
        <option value="">-- Choisir --</option>
        {% for r in regions %}
            <option value="{{ r.id }}">{{ r.libelle }}</option>
        {% endfor %}
    </select>
    <label for="departement">Département</label>
    <select name="departement_id" id="departement" required>
        <option value="">-- Choisir une région --</option>
    </select>
    <label for="annee">Année</label>
    <select name="annee" id="annee" required>
        {% for a in range(2023, 2014, -1) %}
            <option value="{{ a }}">{{ a }}</option>
        {% endfor %}
    </select>
    <button type="submit">Afficher les effectifs</button>
    </form>

    <h2>Consulter les prescriptions</h2>
    <form action="{{ url_for('prescriptions.afficher') }}" method="get">
    <label for="profession">Profession</label>
    <select name="profession_id" id="profession_2" required>
        <option value="">-- Choisir --</option>
        {% for p in professions %}
            <option value="{{ p.id }}">{{ p.libelle }}</option>
        {% endfor %}
    </select>
    <label for="region">Région</label>
    <select name="region_id" id="region_2" required>
        <option value="">-- Choisir --</option>
        {% for r in regions %}
            <option value="{{ r.id }}">{{ r.libelle }}</option>
        {% endfor %}
    </select>
    <label for="departement">Département</label>
    <select name="departement_id" id="departement_2" required>
        <option value="">-- Choisir une région --</option>
    </select>
    <label for="annee">Année</label>
    <select name="annee" id="annee" required>
        {% for a in range(2023, 2014, -1) %}
            <option value="{{ a }}">{{ a }}</option>
        {% endfor %}
    </select>
    <label for="poste">Poste de prescription</label>
<select name="poste_prescription" id="poste" required>
    <option value="">-- Choisir --</option>
    <option value="1">Médicaments</option>
    <option value="2">Dispositifs médicaux</option>
    <option value="3">Biologie</option>
    <option value="4">Soins infirmiers</option>
    <option value="5">Kinésithérapie</option>
    <option value="6">Transports des malades</option>
    <option value="7">Indemnités journalières</option>
    <option value="8">Autres</option>
</select>
    <button type="submit">Afficher les prescriptions</button>
    </form>
    <script>const BASE_URL = "{{ BASE_URL }}";</script>
    <script src="{{ url_for('static', filename='js/cascade.js') }}"></script>
{% endblock %}
