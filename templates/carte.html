{% extends "base.html" %}
{% block titre %}Carte des densités{% endblock %}
{% block contenu %}

<h2>Carte des densités par département</h2>

<!-- Formulaire de sélection -->
<div class="carte-formulaire">
    <label for="profession">Profession</label>
    <select id="profession">
        <option value="">-- Choisir --</option>
        {% for p in professions %}
        <option value="{{ p.libelle }}">{{ p.libelle }}</option>
        {% endfor %}
    </select>

    <label for="annee">Année</label>
    <select id="annee">
        {% for a in range(2023, 2014, -1) %}
        <option value="{{ a }}">{{ a }}</option>
        {% endfor %}
    </select>

    <button class="btn-carte" onclick="chargerCarte()">Afficher la carte</button>
</div>

<!-- Conteneur de la carte -->
<div id="carte" style="height: 600px; margin-top: 1rem;"></div>

<!-- Légende -->
<div id="legende" style="display:none; margin-top: 1rem;">
    <strong>Densité (praticiens pour 100 000 habitants)</strong>
    <div style="display:flex; gap:1rem; margin-top:0.5rem;">
        <span style="background:#EEF4FB; padding:0.3rem 0.8rem;">Faible</span>
        <span style="background:#9DC3E6; padding:0.3rem 0.8rem;">Moyenne</span>
        <span style="background:#2E74B5; color:white; padding:0.3rem 0.8rem;">Élevée</span>
    </div>
</div>

<!-- Leaflet CSS et JS depuis CDN -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const BASE_URL = "{{ BASE_URL }}";

// Initialiser la carte centrée sur la France
const carte = L.map("carte").setView([46.5, 2.5], 6);

// Fond de carte OpenStreetMap
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
}).addTo(carte);

let coucheGeoJSON = null;  // stocke la couche des départements

// Charger le contour des départements
fetch(`${BASE_URL}/static/departements.geojson`)
    .then(r => r.json())
    .then(geojson => {
        window.geojsonData = geojson;  // stocker pour réutilisation
    });

function chargerCarte() {
    const profession = document.getElementById("profession").value;
    const annee = document.getElementById("annee").value;

    if (!profession) {
        alert("Choisis une profession !");
        return;
    }

    // Appel à notre route /api/densites
    fetch(`${BASE_URL}/api/densites?profession=${encodeURIComponent(profession)}&annee=${annee}`)
        .then(r => r.json())
        .then(densites => {
            // Transformer en dictionnaire { code_dept: densite }
            const dictDensites = {};
            let max = 0;
            densites.forEach(d => {
                dictDensites[d.code] = d.densite;
                if (d.densite > max) max = d.densite;
            });

            // Supprimer l'ancienne couche si elle existe
            if (coucheGeoJSON) carte.removeLayer(coucheGeoJSON);

            // Ajouter les départements colorés
            coucheGeoJSON = L.geoJSON(window.geojsonData, {
                style: feature => {
                    const code = feature.properties.code;
                    const densite = dictDensites[code] || 0;
                    return {
                        fillColor: couleur(densite, max),
                        fillOpacity: 0.7,
                        color: "white",
                        weight: 1
                    };
                },
                onEachFeature: (feature, layer) => {
                    const code = feature.properties.code;
                    const densite = dictDensites[code] || "N/A";
                    // Popup au clic
                    layer.bindPopup(`
                        <strong>${feature.properties.nom}</strong><br>
                        Densité : ${densite}
                    `);
                    // Surlignage au survol
                    layer.on("mouseover", () => layer.setStyle({ fillOpacity: 1 }));
                    layer.on("mouseout", () => layer.setStyle({ fillOpacity: 0.7 }));
                }
            }).addTo(carte);

            document.getElementById("legende").style.display = "block";
        });
}

// Fonction qui retourne une couleur selon la densité
function couleur(valeur, max) {
    if (valeur === 0) return "#f0f0f0";        // gris = pas de données
    const ratio = valeur / max;
    if (ratio < 0.33) return "#EEF4FB";        // bleu clair = faible
    if (ratio < 0.66) return "#9DC3E6";        // bleu moyen
    return "#2E74B5";                           // bleu foncé = élevé
}
</script>

{% endblock %}
